[project]
name = "youtabber"
version = "0.1.0"
description = "Turn a play-along video into a clean, printable PDF of its tab"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "brennanpowers", email = "brennanpowers@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.9",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
youtabber = "youtabber.cli:main"

[project.optional-dependencies]
ai = [
    "spandrel>=0.4.2",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
