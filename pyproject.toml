[project]
name = "tabrip"
version = "0.1.0"
description = "Rip the tab from YouTube play-along videos into a clean PDF"
readme = "README.md"
authors = [
    { name = "brennanpowers", email = "brennanpowers@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.9",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
tabrip = "tabrip.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
